<!--
  The Ledger app.

  This page is served from an ordinary web address, NOT from Google. That is
  deliberate and it is the whole point of this file.

  Apps Script serves its own pages through Google Drive, and on a device signed
  into several Google accounts Google routes that request to a per-account
  address that does not exist for web apps — Drive then answers "Sorry, unable
  to open the file at present". Measured across three attempts: no account
  works, one account works, several accounts fail, including inside a Google
  Sites embed, because an embed is still a navigation.

  Here the browser never navigates to Google. It loads this page from a neutral
  host and asks the script for figures in the background. Background requests
  carry no Google session, so there is no account to route by and the fault
  cannot happen. Proven from example.com before this file was written.
-->
